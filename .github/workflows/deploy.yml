name: Build and deploy

# Pull requests only BUILD. Only `main` DEPLOYS.
# One-time setup: repo Settings > Pages > Source = "GitHub Actions".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history: "Recently added" reads each folder's last git commit date.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
